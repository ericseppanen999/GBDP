# GBDP semantic layer: the one description of the gold schema and the one
# definition of every baseball metric.
#
# Read by:
#   - gbdp.semantic (src/gbdp/semantic/): loads and validates this file,
#     compiles metric queries for local DuckDB, Spark and Databricks.
#   - GET /schema, GET /metrics, POST /metrics/query (src/gbdp/serve/api.py)
#     and the MCP tools (src/gbdp/mcp_server.py).
#   - scripts/build_semantic_layer.py: writes the Unity Catalog DDL
#     (table/column COMMENTs, plain views, metric views) to
#     docs/semantic_layer_uc.sql; `gbdp semantic-layer` applies it.
#   - scripts/build_dashboard.py: the dashboard's metric datasets are compiled
#     from the metrics below, so the dashboard can't disagree with them.
#
# tests/test_semantic_layer_schema.py runs the real identity and gold code on
# a fixture silver layer and checks every table and column here against what
# it writes, both ways. tests/test_semantic_metrics.py runs every metric.
#
# SQL in `views` and `metric_views` is written once for every engine. Use
# portable functions only (CASE, COALESCE, NULLIF, TRY_CAST, regexp_extract,
# YEAR, ROW_NUMBER) and these placeholders, which the compiler expands:
#   {{table:NAME}}         a gold table (gbdp.gold_gbdp.NAME in Unity Catalog)
#   {{view:NAME}}          a view defined below
#   {{col:NAME}}           a column whose name differs by engine. Only 2b and
#                          3b: Unity Catalog stores them as c_2b / c_3b
#                          (catalog/managed_publish.py renames names that
#                          start with a digit).
#   {{list:VOCAB.GROUP}}   a quoted IN-list from `vocabularies`
#   {{league_of:EXPR}}     CASE mapping a source system to its league code
#   {{label:VOCAB:EXPR}}   CASE mapping a code to its label in `vocabularies`
#   {{final:EXPR}}         true when a fact_game.status means the game is over

version: 2

conventions:
  ids: >
    player_id, team_id, game_id, season_id, pa_id and pitch_id are ULID-shaped
    IDs hashed from the source system and its raw ID (e.g. "player:source:
    mlb_statsapi:660271"). They are stable across dates, so they join across dt
    partitions. There is no cross-source matching: the same person in MLB Stats
    API and NPB SPAIA has two player_ids unless a manual override links them
    (manual_entity_links.csv). Statcast uses MLB Stats API IDs, so its players
    and games share mlb_statsapi canonical IDs.
  league_id: >
    league_id is the static ID from configs/leagues.yaml (MLB, NPB, INDY, KBO,
    LMB). Fact tables without a league_id get their league from `source` (see
    vocabularies.source_league).
  dt: >
    Every gold table is partitioned by dt (YYYY-MM-DD, a string in the files
    and in Unity Catalog), the date the data is for. Facts hold that day's
    events. dim_player, dim_team and bridge_source_ids hold a full snapshot in
    every dt, so filter them to one dt (the views v_player_current and
    v_team_current do this for you).
  ingested_at_utc: Every table written by gold/publish.py has ingested_at_utc, the ISO timestamp of the write.
  unity_catalog: >
    In Unity Catalog (gbdp.gold_gbdp) the tables are managed Delta copies of
    the files. Two columns are renamed there because Delta names may not start
    with a digit: fact_boxscore_batting.2b is c_2b and 3b is c_3b. List
    columns (dim_player.alternate_names) are stored as JSON strings.

vocabularies:
  event_type:
    description: fact_plate_appearance.event_type, mapped from each source's own outcome codes.
    values:
      1B: Single.
      2B: Double.
      3B: Triple.
      HR: Home run.
      BB: Walk, intentional walks included.
      HBP: Hit by pitch.
      K: Strikeout, including a strikeout double play and a dropped third strike where the batter reaches.
      OUT: Any other batted-ball or ball-in-play out (ground, fly, line, pop, force out).
      DP: Double play (grounded into, lined into). A sacrifice fly double play is SF, not DP.
      TP: Triple play.
      SF: Sacrifice fly, a sacrifice fly double play included, and still SF when the batter reaches on an error or fielder's choice. Not an at-bat; counts in OBP's denominator.
      SH: Sacrifice bunt, squeeze included, and still SH when the batter reaches on an error or fielder's choice. Not an at-bat and not in OBP.
      FC: Fielder's choice.
      ERROR: Batter reached on an error.
      INT: Batter awarded first on catcher's interference.
      TRUNCATED: >
        Not a plate appearance. The inning or game ended while this batter was
        up, on something other than the batter (caught stealing, pickoff,
        walk-off wild pitch). The row is kept because it carries that third
        out and any runs that scored. Statcast calls it truncated_pa; NPB rows
        get it when the last header of a half-inning has no result.
      UNKNOWN: The source outcome could not be mapped. Counted as a PA, not as an at-bat.
    legacy:
      SAC: >
        Written before gold split sacrifices into SF and SH: a sacrifice fly
        or bunt. The code no longer writes it and the gold rebuild replaces
        it; until then a SAC row counts as a sacrifice fly (in OBP's
        denominator, as it always did), and a sacrifice fly double play from
        then is still DP, an at-bat.
    groups:
      not_a_pa: [TRUNCATED]
      at_bat: [1B, 2B, 3B, HR, K, OUT, DP, TP, FC, ERROR]
      hit: [1B, 2B, 3B, HR]
      walk: [BB]
      hit_by_pitch: [HBP]
      strikeout: [K]
      # SAC is legacy (see legacy): counted with SF so OBP on pre-rebuild
      # gold is what it was. Drop it once production gold has no SAC rows.
      sac_fly: [SF, SAC]
      sac_bunt: [SH]
      sacrifice: [SF, SH, SAC]

  base_state:
    description: >
      base_state_before / base_state_after (fact_plate_appearance) and
      base_state (run_expectancy): a bitmask of occupied bases, 1 = first,
      2 = second, 4 = third.
    values:
      0: Bases empty
      1: 1st
      2: 2nd
      3: 1st & 2nd
      4: 3rd
      5: 1st & 3rd
      6: 2nd & 3rd
      7: Loaded

  source_league:
    description: The league each source system's rows belong to (the league codes gold/publish.py assigns per source).
    values:
      mlb_statsapi: MLB
      mlb_statcast: MLB
      retrosheet_local: MLB
      npb_spaia: NPB
      kbo_api: KBO
      kbo_local: KBO
      lmb_local: LMB
      indy_local: INDY

  final_status:
    description: >
      fact_game.status values that mean the game is over. MLB uses Final, Game
      Over and Completed Early (plus "Final: ..." variants), KBO Final, NPB
      試合終了, Retrosheet final. Postponed, cancelled (試合中止, 우천취소),
      scheduled and in-progress games are not final.
    values: [Final, final, Game Over, Completed Early, 試合終了]
    prefixes: ["Final:", "Completed Early:"]

  season_phase:
    description: >
      Which part of the season a game belongs to, mapped from
      fact_game.game_type per source. Rules are checked in order and the
      first match wins: values match exactly, suffixes match the end of the
      text, contains matches anywhere (so a sponsor's prefix, as in
      SMBC日本シリーズ, still maps). The NPB names are confirmed from silver
      npb_spaia games, 2026-05-13 to 11-05: セ・リーグ公式戦 and パ・リーグ公式戦
      and セ・パ交流戦 (interleague) are regular; オールスターゲーム is allstar;
      日本シリーズ and the four Climax Series stages, written as
      "セ・リーグ　クライマックスシリーズ　ファーストステージ" (league prefix and
      stage suffix, U+3000 ideographic spaces), are postseason, which is why
      those rules use contains. No preseason (オープン戦) or farm game occurs
      in that range, so the preseason rule is unconfirmed, and farm games
      (ファーム...) have no rule and are other. A game_type no rule matches is other (kept, never dropped); a
      null game_type (sources without one, and rows published before gold
      had the column) is unknown. Team records default to regular and
      unknown (see mv_team_games).
    rules:
      - {phase: regular, source: mlb_statsapi, values: [R]}
      - {phase: postseason, source: mlb_statsapi, values: [F, D, L, W]}
      - {phase: allstar, source: mlb_statsapi, values: [A]}
      - {phase: preseason, source: mlb_statsapi, values: [S]}
      - {phase: exhibition, source: mlb_statsapi, values: [E]}
      # Retrosheet's gametype, mapped in silver to the statsapi codes (its
      # tie-breaker "playoff" games are R); P is its pre-1950 championship series.
      - {phase: regular, source: retrosheet_local, values: [R]}
      - {phase: postseason, source: retrosheet_local, values: [F, D, L, W, P]}
      - {phase: allstar, source: retrosheet_local, values: [A]}
      - {phase: exhibition, source: retrosheet_local, values: [E]}
      # kbo_api, from its SR_ID series code; P is every postseason round.
      - {phase: regular, source: kbo_api, values: [R]}
      - {phase: postseason, source: kbo_api, values: [P]}
      - {phase: allstar, source: kbo_api, values: [A]}
      - {phase: exhibition, source: kbo_api, values: [E]}
      - {phase: regular, source: npb_spaia, suffixes: [公式戦], values: [セ・パ交流戦]}
      - {phase: postseason, source: npb_spaia, contains: [クライマックスシリーズ, 日本シリーズ]}
      - {phase: allstar, source: npb_spaia, contains: [オールスター]}
      - {phase: preseason, source: npb_spaia, contains: [オープン戦]}
    values: [regular, postseason, allstar, preseason, exhibition, other, unknown]
    groups:
      record_default: [regular, unknown]

  pitch_result:
    description: >
      fact_pitch.result, Statcast's pitch description. A swing is any pitch
      the batter offered at; a whiff is a swing that missed. Foul tips count
      as swings with contact, not whiffs.
    groups:
      swing: [swinging_strike, swinging_strike_blocked, missed_bunt, foul, foul_tip, foul_bunt, bunt_foul_tip,
              hit_into_play, hit_into_play_no_out, hit_into_play_score]
      whiff: [swinging_strike, swinging_strike_blocked, missed_bunt]

  pitch_type:
    description: fact_pitch.pitch_type, Statcast's pitch classification.
    values:
      FF: 4-seam fastball
      SI: Sinker
      FC: Cutter
      SL: Slider
      ST: Sweeper
      SV: Slurve
      CU: Curveball
      KC: Knuckle curve
      CS: Slow curve
      CH: Changeup
      FS: Splitter
      FO: Forkball
      SC: Screwball
      KN: Knuckleball
      EP: Eephus
      FA: Other fastball
      PO: Pitchout

tables:
  dim_league:
    description: Static league reference from configs/leagues.yaml, rewritten in every dt.
    grain: one row per league per dt
    primary_key: [league_code, dt]
    sources: [configs/leagues.yaml]
    columns:
      league_id: Static league ID (configs/leagues.yaml).
      league_code: MLB, NPB, INDY, KBO or LMB.
      country: ISO-3 country code (USA, JPN, KOR, MEX).
      level: major or independent.
      season_start_month: Usual first month of the season (1-12), from config.
      season_end_month: Usual last month of the season (1-12), from config.
      dt: Snapshot date.
      ingested_at_utc: When this row was written.

  dim_team:
    description: >
      Team dimension, SCD2. Built each day from that day's games (every source
      with a games entity except kbo_api) and from the MLB season team list
      (silver mlb_statsapi/teams), which also covers MLB teams without a game
      that day. Each dt is a full snapshot of every version known by then.
    grain: one row per team_id per version (valid_from_dt), within each dt snapshot
    primary_key: [team_id, valid_from_dt, dt]
    foreign_keys:
      league_id: dim_league.league_id
    sources: [mlb_statsapi, npb_spaia, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      team_id: Canonical team ID.
      league_id: FK to dim_league.
      team_name: Display name as the source gives it (native language for NPB, not translated).
      team_abbrev: Team abbreviation (e.g. NYY). MLB only, from the season team list; null for other leagues.
      home_city: Home city or location name (e.g. Bronx). MLB only, from the season team list; null for other leagues.
      valid_from_dt: First date this version of the team's attributes applies.
      valid_to_dt: Last date this version applied; null while it is current.
      is_current: True for the open (latest) version.
      source: Source system that produced this version.
      source_team_id: The source's own team ID.
      dt: Snapshot date.
      ingested_at_utc: When this row was written.
    caveats:
      - Always filter to one dt (normally the latest) and is_current = true, or use the view v_team_current.
      - Versions change when team_name, team_abbrev, home_city or league_id change.
      - KBO teams are missing. dim_team does not read kbo_api games, so the team_ids in fact_game and the KBO box scores have no dim_team row.
      - On a day with no silver mlb_statsapi/teams partition, team_abbrev and home_city are carried over from the previous snapshot (not one dated before a rebuild's --fresh-dims-before date); with no earlier snapshot they are null. Partitions published before that fix, until the production rebuild is verified, can have versions with them null.

  dim_player:
    description: >
      Player dimension, SCD2. Built each day from active rosters (MLB, NPB and
      the local sources) plus MLB's season player list, which adds players on
      a 40-man roster but not that day's active roster (injured list, minors,
      recently traded), since Statcast still sees them. NPB rows are players
      only: the NPB directory's managers and coaches are left out. Each dt is
      a full snapshot of every version known by then.
    grain: one row per player_id per version (valid_from_dt), within each dt snapshot
    primary_key: [player_id, valid_from_dt, dt]
    foreign_keys:
      league_id: dim_league.league_id
    sources: [mlb_statsapi, npb_spaia, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      player_id: Canonical player ID.
      primary_name: Display name as the source gives it (kanji for NPB).
      alternate_names: Other spellings, a list (a JSON string in Unity Catalog). NPB only, the kana reading; null elsewhere.
      dob: Date of birth (YYYY-MM-DD). MLB only, from the season player list.
      bats: Batting side, L / R / S, or UNK when the source doesn't say (every source except MLB).
      throws: Throwing hand, L / R, or UNK when the source doesn't say (every source except MLB).
      height_cm: Height in cm. MLB only.
      weight_kg: Weight in kg. MLB only.
      nationality: Birth country as the source reports it (not citizenship). MLB only.
      primary_position: Roster position abbreviation (P, C, 1B, SS, OF, ...); format varies by source.
      valid_from_dt: First date this version of the player's attributes applies.
      valid_to_dt: Last date this version applied; null while it is current.
      is_current: True for the open (latest) version.
      source: Source system that produced this version.
      source_player_id: The source's own player ID.
      league_id: FK to dim_league, the league of the roster the player came from.
      dt: Snapshot date.
      ingested_at_utc: When this row was written.
    caveats:
      - Always filter to one dt (normally the latest) and is_current = true, or use the view v_player_current.
      - Versions change when primary_name, bats, throws, primary_position or league_id change.
      - kbo_api has no roster or player ID; its box-score players are identified by name and have no dim_player row.
      - The SCD2 merge keeps a player missing from a day's input as current (an off day is not a release), across seasons too, so a player who has left every roster stays current. A rebuild run with --fresh-dims-before D ignores snapshots dated before D, so history starts at D. Until the production rebuild is verified, older partitions can also hold NPB managers and coaches, and MLB versions built from backfilled roster bronze can reflect the fetch day's roster rather than dt's.

  dim_season:
    description: >
      Synthetic season reference, generated for the dt's calendar year for
      MLB, NPB, INDY, KBO and LMB. The start and end dates are fixed
      calendar guesses, not each league's real opening day or last game.
    grain: one row per league per season_year per dt
    primary_key: [season_id, dt]
    foreign_keys:
      league_id: dim_league.league_id
    sources: [generated]
    columns:
      season_id: Canonical season ID, hashed from league code and year (season:MLB:2026).
      league_id: FK to dim_league.
      season_year: Calendar year.
      season_type: Always regular.
      season_start_dt: Approximate season start (YYYY-MM-DD).
      season_end_dt: Approximate season end (YYYY-MM-DD).
      dt: Snapshot date.
      ingested_at_utc: When this row was written.

  fact_game:
    description: One row per game per source, in the dt of the schedule day the source listed it on.
    grain: one row per (game_id, dt)
    primary_key: [game_id, dt]
    foreign_keys:
      league_id: dim_league.league_id
      season_id: dim_season.season_id
      home_team_id: dim_team.team_id
      away_team_id: dim_team.team_id
    sources: [mlb_statsapi, npb_spaia, kbo_api, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      game_id: Canonical game ID, hashed from source and the source's game ID (game:mlb_statsapi:745123).
      league_id: FK to dim_league.
      season_id: FK to dim_season (the dt's calendar year).
      game_date: The source's game date. A UTC start timestamp for MLB (so a night game can show the next day), a date elsewhere.
      game_start_ts_utc: Same value as game_date; the source's timestamp where it has one.
      home_team_id: FK to dim_team.
      away_team_id: FK to dim_team.
      venue: Venue name (MLB, KBO, Retrosheet); null elsewhere.
      game_type: >
        The source's game type. MLB Stats API gameType (R regular season, S
        spring, E exhibition, A All-Star, F wild card, D division series, L
        LCS, W World Series); NPB SPAIA's Japanese name (セ・リーグ公式戦 /
        パ・リーグ公式戦 league games, セ・パ交流戦 interleague,
        クライマックスシリーズ, 日本シリーズ); Retrosheet's gametype as the
        statsapi codes (tie-breaker playoff games R, P its pre-1950
        championship series); kbo_api R/E/A from its series code and P for
        every postseason round. indy/kbo/lmb local files pass a game_type
        through when they have one, else null. Null too in partitions
        published before gold had the column. See vocabularies.season_phase.
      status: The source's own status text, see vocabularies.final_status. NPB uses Japanese (試合終了 = final, 試合中止 = called off).
      home_score: Home runs, final or as of the fetch.
      away_score: Away runs, final or as of the fetch.
      source: Source system.
      source_game_id: The source's own game ID (MLB gamePk, SPAIA gameId, KBO G_ID, Retrosheet gid).
      dt: Schedule date the row was fetched for.
      ingested_at_utc: When this row was written.
    caveats:
      - A game can appear in more than one dt (postponed or suspended and resumed, or listed again on the next day's schedule). Count games with DISTINCT game_id, or use v_team_game, which keeps one row per game.
      - The same real game appears once per source that covers it (mlb_statsapi and retrosheet_local both have MLB); game_id differs per source. Filter on source for exactly-once counts.
      - status is free text and varies by source; scores are null until a game starts.
      - game_type is null for sources that don't give one (KBO, Retrosheet, local files) and in partitions published before gold had the column; season_phase calls those unknown.

  fact_roster:
    description: Daily roster snapshot. NPB rows are players only, no managers or coaches.
    grain: one row per (team_id, player_id, source) per dt
    primary_key: [team_id, player_id, source, dt]
    foreign_keys:
      team_id: dim_team.team_id
      player_id: dim_player.player_id
      season_id: dim_season.season_id
    sources: [mlb_statsapi, npb_spaia, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      team_id: FK to dim_team.
      player_id: FK to dim_player.
      season_id: FK to dim_season.
      role: Always player.
      start_dt: The dt (the roster is a one-day snapshot).
      end_dt: Always null.
      source: Source system.
      dt: Roster date.
      ingested_at_utc: When this row was written.
    caveats:
      - MLB rows are the active roster as of that date, not the 40-man roster.
      - Until the production rebuild of gold is verified, older partitions can break both rules above. Backfilled MLB roster bronze fetched before the as-of-date fix holds the roster of the day it was fetched, not of dt, and NPB partitions built before the players-only change still include managers and coaches.

  fact_transaction:
    description: MLB transactions (trades, signings, recalls, assignments, injured list) from the MLB Stats API.
    grain: one row per transaction_id per dt
    primary_key: [transaction_id, dt]
    foreign_keys:
      league_id: dim_league.league_id
      team_id: dim_team.team_id
      player_id: dim_player.player_id
    sources: [mlb_statsapi]
    columns:
      transaction_id: Canonical ID, hashed from the source's transaction ID.
      league_id: Always MLB.
      team_id: FK to dim_team, the team that made the transaction.
      player_id: FK to dim_player.
      transaction_type: The source's type description (e.g. Trade, Recalled, Optioned).
      effective_dt: Date the transaction took effect (YYYY-MM-DD).
      details: The source's description text.
      source: Always mlb_statsapi.
      dt: Date fetched for.
      ingested_at_utc: When this row was written.

  fact_pitch:
    description: Every pitch, MLB only, from Statcast (Baseball Savant's CSV export).
    grain: one row per pitch_id
    primary_key: [pitch_id]
    foreign_keys:
      game_id: fact_game.game_id
      pa_id: fact_plate_appearance.pa_id
      pitcher_id: dim_player.player_id
      batter_id: dim_player.player_id
    sources: [mlb_statcast]
    columns:
      pitch_id: Canonical ID, hashed from gamePk, at-bat number and pitch number.
      game_id: FK to fact_game (the mlb_statsapi game).
      pa_id: FK to fact_plate_appearance, the PA this pitch belongs to.
      pitch_number_in_pa: 1-based pitch number within the PA.
      pitcher_id: FK to dim_player.
      batter_id: FK to dim_player.
      balls_before: Balls before the pitch.
      strikes_before: Strikes before the pitch.
      pitch_type: Statcast pitch type, see vocabularies.pitch_type. Null or empty for some pitches (pitchouts, missing tracking).
      release_speed: Release speed in mph.
      plate_x: Horizontal location at the plate, feet from the center, catcher's view.
      plate_z: Height at the plate, feet above the ground.
      result: Statcast's pitch description (ball, called_strike, swinging_strike, foul, hit_into_play, ...), see vocabularies.pitch_result.
      source: Always mlb_statcast.
      dt: Game date.
      ingested_at_utc: When this row was written.
    caveats:
      - Baseball Savant often hasn't published the previous day by the nightly run at 04:00 UTC. A recent dt can have partial or no pitches; check pitch_coverage in audit_quality.

  fact_plate_appearance:
    description: >
      One row per plate appearance: MLB from Statcast (pitch rows grouped by
      at-bat), NPB rebuilt from SPAIA's text play-by-play (one row per real PA),
      and Retrosheet plays where loaded. Plus TRUNCATED rows, which are not
      plate appearances (see vocabularies.event_type).
    grain: one row per pa_id
    primary_key: [pa_id]
    foreign_keys:
      game_id: fact_game.game_id
      batting_team_id: dim_team.team_id
      fielding_team_id: dim_team.team_id
      batter_id: dim_player.player_id
      pitcher_id: dim_player.player_id
    sources: [mlb_statcast, npb_spaia, retrosheet_local]
    columns:
      pa_id: Canonical ID. Statcast and fact_pitch derive it from gamePk and at-bat number.
      game_id: FK to fact_game.
      inning: Inning number.
      is_top_inning: True in the top half (the away team bats).
      batting_team_id: FK to dim_team. Retrosheet states it; otherwise filled from fact_game's home/away teams and the inning half.
      fielding_team_id: FK to dim_team, the other team.
      batter_id: FK to dim_player. For Statcast, the batter on the PA's last pitch (a pinch hitter takes over the PA).
      pitcher_id: FK to dim_player. Null for NPB (the text play-by-play doesn't name the pitcher per PA).
      event_type: The outcome, see vocabularies.event_type.
      rbi: Runs batted in. Retrosheet only; null for Statcast and NPB.
      runs_scored_on_play: Runs the batting team scored during the PA, every source including NPB (from the score SPAIA prints). For Statcast, measured from the PA's first pitch to its last, so runs on a wild pitch or steal during the PA count.
      outs_on_play: outs_after - outs_before, so it includes outs made on the bases during the PA.
      base_state_before: Runners on base before the PA, see vocabularies.base_state.
      outs_before: Outs before the PA (0-2).
      base_state_after: Runners after the PA; 0 when it ended the half-inning; null (unknown) when it ended the game short of three outs, a walk-off, in every source. For NPB, the runners come from the next PA's header, or for a half-inning's last PA from the end of its result text, and are null when that text names no runners.
      outs_after: Outs after the PA (0-3).
      runs_to_end_of_inning: Runs from this PA through the end of its half-inning, what run expectancy averages. Null when the half-inning never reached three outs (walk-off, suspended, gaps in the feed) or a later PA's runs are unknown.
      source: Source system.
      dt: Game date.
      ingested_at_utc: When this row was written.
    caveats:
      - TRUNCATED rows are not plate appearances. Exclude them from PA counts and every PA-based rate (use the is_pa flag in v_plate_appearance); keep them for runs and outs.
      - For Statcast the state after a PA is read from the next PA's first pitch, so a stolen base or pickoff between PAs is credited to the earlier PA.
      - MLB games can be in both mlb_statcast and retrosheet_local; filter on source to avoid counting a game twice.
      - There is no RBI outside Retrosheet.
      - Rows written before the SF/SH split (until the gold rebuild) carry SAC for both kinds of sacrifice and DP for a sacrifice fly double play; see vocabularies.event_type.legacy.

  fact_boxscore_batting:
    description: Per-player, per-game batting line from each source's box score.
    grain: one row per (game_id, player_id, source)
    primary_key: [game_id, player_id, source]
    foreign_keys:
      game_id: fact_game.game_id
      team_id: dim_team.team_id
      player_id: dim_player.player_id
    sources: [mlb_statsapi, kbo_api, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      game_id: FK to fact_game.
      team_id: FK to dim_team.
      player_id: FK to dim_player. kbo_api players are matched by name; indy/kbo/lmb local rows are null when identity has no match.
      ab: At-bats.
      h: Hits.
      2b: Doubles. c_2b in Unity Catalog. Null for kbo_api.
      3b: Triples. c_3b in Unity Catalog. Null for kbo_api.
      hr: Home runs. Null for kbo_api.
      bb: Walks. Null for kbo_api.
      so: Strikeouts. Null for kbo_api.
      rbi: Runs batted in.
      r: Runs scored.
      source: Source system.
      dt: Game date.
      ingested_at_utc: When this row was written.
    caveats:
      - There is no NPB box score in gold; NPB batting comes from fact_plate_appearance.
      - kbo_api fills only ab, h, rbi and r.
      - The local sources (indy_local, kbo_local, lmb_local, retrosheet_local) only have rows where manual files were supplied.
      - Per game, not per season. SUM over the games you want, or use the metric view mv_batting_box.

  fact_boxscore_pitching:
    description: Per-player, per-game pitching line from each source's box score.
    grain: one row per (game_id, player_id, source)
    primary_key: [game_id, player_id, source]
    foreign_keys:
      game_id: fact_game.game_id
      team_id: dim_team.team_id
      player_id: dim_player.player_id
    sources: [mlb_statsapi, kbo_api, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      game_id: FK to fact_game.
      team_id: FK to dim_team.
      player_id: FK to dim_player. kbo_api pitchers are matched by name.
      ip: >
        Innings pitched as a STRING, not a decimal. MLB and Retrosheet write
        "6.1" for 6 1/3 and "6.2" for 6 2/3 innings; kbo_api writes "6",
        "5 2/3" or "1/3". Never sum or average it as a number: convert to outs
        first (ip_outs in v_pitching_line does).
      h: Hits allowed.
      r: Runs allowed.
      er: Earned runs allowed.
      bb: Walks allowed (kbo_api counts walks plus hit batters, its 4사구 column).
      so: Strikeouts.
      hr: Home runs allowed.
      source: Source system.
      dt: Game date.
      ingested_at_utc: When this row was written.
    caveats:
      - No NPB box score in gold.
      - The local sources only have rows where manual files were supplied.

  fact_standings:
    description: NPB standings as published by SPAIA. No other league has standings; derive records from fact_game (metric view mv_team_games).
    grain: one row per team_id per dt
    primary_key: [team_id, dt]
    foreign_keys:
      league_id: dim_league.league_id
      season_id: dim_season.season_id
      team_id: dim_team.team_id
    sources: [npb_spaia]
    columns:
      league_id: Always NPB.
      season_id: FK to dim_season.
      team_id: FK to dim_team.
      w: Wins.
      l: Losses.
      t: Ties.
      pct: Winning percentage as text (".500").
      gb: Games behind as text ("-" for the leader).
      source: Always npb_spaia.
      dt: Standings date.
      ingested_at_utc: When this row was written.

  fact_contract:
    description: Placeholder. No source populates contracts; the table is never written, so it has no columns and does not exist in Unity Catalog.
    grain: none
    placeholder: true
    sources: []
    columns: {}

  bridge_source_ids:
    description: >
      Identity bridge, written by identity/resolver.py: every (entity_type,
      source, source_id) seen that day and its canonical ID. Use it to go from
      a raw source ID (an MLB gamePk player ID you know) to the player_id or
      team_id used in gold.
    grain: one row per sighting of (entity_type, source, source_id) per dt; a team is listed once per game it played that day
    written_by: identity/resolver.py
    caveats:
      - Not unique on (entity_type, source, source_id, dt). The duplicates carry the same canonical_id, so SELECT DISTINCT entity_type, source, source_id, canonical_id before joining or counting.
    sources: [mlb_statsapi, npb_spaia, kbo_api, indy_local, kbo_local, lmb_local, retrosheet_local]
    columns:
      entity_type: player or team.
      source: Source system.
      source_id: The source's own ID (for kbo_api players, the player's name).
      canonical_id: The player_id or team_id used in gold.
      first_seen_dt: The dt (identity is resolved one day at a time).
      last_seen_dt: The dt.
      confidence: Match confidence, 0-1 (0.9 for an exact source ID).
      match_method: exact_id, exact_name_dob, name_team, exact_name_league or unknown.
      manual_override: True when manual_entity_links.csv set canonical_id.
      notes: Always null.
      dt: Snapshot date.

  run_expectancy:
    description: >
      Season-to-date run expectancy (the RE24 matrix) per league: the average
      runs scored from each base/out state to the end of the half-inning,
      over every completed half-inning of that league's season through dt.
      The latest dt of a season is the full-season matrix only if every
      date was published in order: see the caveat.
    grain: one row per (league_code, base_state, outs) per dt
    primary_key: [league_code, base_state, outs, dt]
    foreign_keys:
      league_id: dim_league.league_id
    sources: [fact_plate_appearance]
    columns:
      league_code: MLB or NPB (the leagues with plate appearances).
      league_id: FK to dim_league.
      season_year: The dt's calendar year; each season starts from zero.
      base_state: Runners on base, see vocabularies.base_state.
      outs: Outs, 0-2.
      pa_count: PAs from this state in the season through dt (TRUNCATED rows included, since they end innings).
      runs: Sum of runs_to_end_of_inning over those PAs.
      exp_runs: runs / pa_count, rounded to 4 places.
      dt: Through this date.
      ingested_at_utc: When this row was written.
    caveats:
      - Only half-innings that reached three outs count (runs_to_end_of_inning not null).
      - Early in a season the counts are small and the values noisy; check pa_count.
      - Each dt is summed from run_expectancy_daily. Publishing a date range now also rebuilds every later date of that season from the daily rows, but a later dt can still be stale if that refresh didn't run (an interrupted rebuild, or partitions from before the fix). Summing run_expectancy_daily is always current, and is what mv_run_expectancy and v_plate_appearance's run values do.

  run_expectancy_daily:
    description: >
      One day's contribution to run_expectancy: PA count and rest-of-inning
      runs per (league, base state, outs). run_expectancy for a date is the
      sum of these from January 1 through it, as of when that date was
      published. Sum any date range yourself for the matrix over that range
      (metric view mv_run_expectancy and v_plate_appearance do); unlike
      run_expectancy, the sum is never stale after a rebuild.
    grain: one row per (league_code, base_state, outs) per dt
    primary_key: [league_code, base_state, outs, dt]
    foreign_keys:
      league_id: dim_league.league_id
    sources: [fact_plate_appearance]
    columns:
      league_code: MLB or NPB.
      league_id: FK to dim_league.
      season_year: The dt's calendar year.
      base_state: Runners on base, see vocabularies.base_state.
      outs: Outs, 0-2.
      pa_count: PAs from this state that day with a known runs_to_end_of_inning.
      runs: Sum of their runs_to_end_of_inning.
      dt: Game date.
      ingested_at_utc: When this row was written.

  breakout_candidates:
    description: >
      Not breakout modeling, despite the name: the day's top 20 batters by
      home runs (then hits) in fact_boxscore_batting. No trend, rate or
      year-over-year analysis.
    grain: up to 20 rows per dt
    primary_key: [player_id, dt]
    foreign_keys:
      player_id: dim_player.player_id
    sources: [fact_boxscore_batting]
    columns:
      player_id: FK to dim_player.
      hr: Home runs that day.
      h: Hits that day.
      ab: At-bats that day.
      dt: Game date.
      ingested_at_utc: When this row was written.

  feature_player_rolling_30d:
    description: Per-player batting totals over the 30 days ending dt, from fact_boxscore_batting, for ML features.
    grain: one row per player_id per dt
    primary_key: [player_id, dt]
    foreign_keys:
      player_id: dim_player.player_id
    sources: [fact_boxscore_batting]
    columns:
      player_id: FK to dim_player.
      ab: At-bats in the window.
      h: Hits in the window.
      hr: Home runs in the window (0 for kbo_api, which has no HR).
      rbi: RBI in the window.
      bb: Walks in the window.
      so: Strikeouts in the window.
      window_days: Always 30.
      dt: Last day of the window.
      ingested_at_utc: When this row was written.

audit_tables:
  # Operational tables, not for baseball analysis. Check them before trusting
  # a dt's analytical tables.
  audit_quality: Per-check results of the quality stage (uniqueness, referential_integrity, row_count_min, base_state_range, outs_range are hard checks that fail the run; pitch_coverage, npb_pbp_coverage, schema_drift are soft). One row per check per table per dt; ok is the result, and the other columns (dupes, missing, count, pct, threshold, invalid, ...) depend on the check.
  audit_pipeline_runs: One row per pipeline run and dt, with row_counts_by_table (JSON) and total_rows.
  audit_stage_runs: One row per pipeline stage per dt with status, start and end times and details.
  audit_schema: Bronze schema-drift snapshots, JSON files per source/entity/dt rather than a table.
  merge_events: Manual identity overrides applied that day (entity_type, source, source_id, canonical_id, match_method, notes). With no overrides it holds a single {empty = true} placeholder row.

views:
  # Plain views. Created in Unity Catalog next to the tables, and on every
  # local DuckDB connection, so /query and SQL users can use them too. Each
  # metric view reads one of them.
  v_player_current:
    description: >
      Current version of every player in the latest dim_player snapshot (the
      newest dt only; a player missing from it is not current, whatever older
      snapshots say). One row per player_id.
    sql: |
      SELECT player_id, primary_name, bats, throws, primary_position, league_id
      FROM (
        SELECT p.player_id, p.primary_name, p.bats, p.throws, p.primary_position, p.league_id, p.dt,
               MAX(p.dt) OVER () AS latest_dt,
               ROW_NUMBER() OVER (PARTITION BY p.player_id ORDER BY p.dt DESC, p.valid_from_dt DESC) AS rn
        FROM {{table:dim_player}} p
        WHERE p.is_current
      ) ranked
      -- Only entities in the newest snapshot. (A join to MAX(dt), or a
      -- scalar subquery, hits a DuckDB 1.5 binder error once joined.)
      WHERE rn = 1 AND dt = latest_dt

  v_team_current:
    description: >
      Current version of every team in the latest dim_team snapshot (the
      newest dt only). One row per team_id.
    sql: |
      SELECT team_id, team_name, team_abbrev, home_city, league_id
      FROM (
        SELECT t.team_id, t.team_name, t.team_abbrev, t.home_city, t.league_id, t.dt,
               MAX(t.dt) OVER () AS latest_dt,
               ROW_NUMBER() OVER (PARTITION BY t.team_id ORDER BY t.dt DESC, t.valid_from_dt DESC) AS rn
        FROM {{table:dim_team}} t
        WHERE t.is_current
      ) ranked
      -- Only entities in the newest snapshot. (A join to MAX(dt), or a
      -- scalar subquery, hits a DuckDB 1.5 binder error once joined.)
      WHERE rn = 1 AND dt = latest_dt

  v_plate_appearance:
    description: >
      fact_plate_appearance with league, season, outcome flags (is_pa, is_ab,
      is_hit, ...; TRUNCATED rows have is_pa = 0 and every outcome flag 0) and
      RE24 run value: run expectancy after minus before, plus runs scored,
      using the league's full-season matrix, summed here from
      run_expectancy_daily (so it stays right when an earlier date is rebuilt
      and run_expectancy's later dates go stale).
    sql: |
      WITH re AS (
        SELECT league_code, season_year, base_state, outs,
               CAST(SUM(runs) AS DOUBLE) / NULLIF(SUM(pa_count), 0) AS exp_runs
        FROM {{table:run_expectancy_daily}}
        GROUP BY league_code, season_year, base_state, outs
      ),
      pa AS (
        SELECT
          f.pa_id, f.game_id, f.dt,
          CAST(f.dt AS DATE) AS game_date,
          YEAR(CAST(f.dt AS DATE)) AS season_year,
          {{league_of:f.source}} AS league_code,
          f.source AS data_source,
          f.inning, f.is_top_inning, f.batting_team_id, f.fielding_team_id, f.batter_id, f.pitcher_id,
          f.event_type, f.runs_scored_on_play, f.outs_on_play,
          f.base_state_before, f.outs_before, f.base_state_after, f.outs_after, f.runs_to_end_of_inning,
          CASE WHEN f.event_type IN {{list:event_type.not_a_pa}} THEN 0 ELSE 1 END AS is_pa,
          CASE WHEN f.event_type IN {{list:event_type.at_bat}} THEN 1 ELSE 0 END AS is_ab,
          CASE WHEN f.event_type IN {{list:event_type.hit}} THEN 1 ELSE 0 END AS is_hit,
          CASE WHEN f.event_type = '1B' THEN 1 ELSE 0 END AS is_single,
          CASE WHEN f.event_type = '2B' THEN 1 ELSE 0 END AS is_double,
          CASE WHEN f.event_type = '3B' THEN 1 ELSE 0 END AS is_triple,
          CASE WHEN f.event_type = 'HR' THEN 1 ELSE 0 END AS is_hr,
          CASE WHEN f.event_type IN {{list:event_type.walk}} THEN 1 ELSE 0 END AS is_bb,
          CASE WHEN f.event_type IN {{list:event_type.hit_by_pitch}} THEN 1 ELSE 0 END AS is_hbp,
          CASE WHEN f.event_type IN {{list:event_type.strikeout}} THEN 1 ELSE 0 END AS is_k,
          CASE WHEN f.event_type IN {{list:event_type.sacrifice}} THEN 1 ELSE 0 END AS is_sac,
          CASE WHEN f.event_type IN {{list:event_type.sac_fly}} THEN 1 ELSE 0 END AS is_sf,
          CASE WHEN f.event_type IN {{list:event_type.sac_bunt}} THEN 1 ELSE 0 END AS is_sh,
          CASE f.event_type WHEN '1B' THEN 1 WHEN '2B' THEN 2 WHEN '3B' THEN 3 WHEN 'HR' THEN 4 ELSE 0 END AS total_bases
        FROM {{table:fact_plate_appearance}} f
      )
      SELECT
        pa.*,
        before_state.exp_runs AS re_before,
        CASE WHEN pa.outs_after >= 3 THEN CAST(0 AS DOUBLE) ELSE after_state.exp_runs END AS re_after,
        CASE WHEN pa.outs_after >= 3 THEN CAST(0 AS DOUBLE) ELSE after_state.exp_runs END
          - before_state.exp_runs + pa.runs_scored_on_play AS run_value
      FROM pa
      LEFT JOIN re before_state
        ON before_state.league_code = pa.league_code AND before_state.season_year = pa.season_year
       AND before_state.base_state = pa.base_state_before AND before_state.outs = pa.outs_before
      LEFT JOIN re after_state
        ON after_state.league_code = pa.league_code AND after_state.season_year = pa.season_year
       AND after_state.base_state = pa.base_state_after AND after_state.outs = pa.outs_after

  v_batting_line:
    description: fact_boxscore_batting with league and season, and 2b/3b as doubles/triples (the same name in every engine).
    sql: |
      SELECT
        b.game_id, b.team_id, b.player_id, b.dt,
        CAST(b.dt AS DATE) AS game_date,
        YEAR(CAST(b.dt AS DATE)) AS season_year,
        {{league_of:b.source}} AS league_code,
        b.source AS data_source,
        b.ab, b.h, b.{{col:2b}} AS doubles, b.{{col:3b}} AS triples, b.hr, b.bb, b.so, b.rbi, b.r
      FROM {{table:fact_boxscore_batting}} b

  v_pitching_line:
    description: >
      fact_boxscore_pitching with league, season and ip_outs: innings pitched
      converted to outs. "6.1" is 19 outs, "6.2" is 20, kbo_api's "5 2/3" is
      17 and "1/3" is 1. ip_outs is null when ip doesn't parse.
    sql: |
      SELECT
        p.game_id, p.team_id, p.player_id, p.dt,
        CAST(p.dt AS DATE) AS game_date,
        YEAR(CAST(p.dt AS DATE)) AS season_year,
        {{league_of:p.source}} AS league_code,
        p.source AS data_source,
        p.ip,
        CASE
          WHEN p.ip LIKE '%/3' THEN
            COALESCE(TRY_CAST(regexp_extract(p.ip, '^([0-9]+) ', 1) AS INT), 0) * 3
            + TRY_CAST(regexp_extract(p.ip, '([12])/3$', 1) AS INT)
          ELSE
            TRY_CAST(regexp_extract(p.ip, '^([0-9]+)', 1) AS INT) * 3
            + COALESCE(TRY_CAST(regexp_extract(p.ip, '[.]([0-2])$', 1) AS INT), 0)
        END AS ip_outs,
        p.h, p.r, p.er, p.bb, p.so, p.hr
      FROM {{table:fact_boxscore_pitching}} p

  v_team_game:
    description: >
      One row per team per finished game: two per game (home and away). A
      game listed in several dts is kept once, on the first dt it was final.
      Games without both scores or not final (vocabularies.final_status) are
      left out. season_phase comes from game_type (vocabularies.season_phase).
    sql: |
      WITH ranked AS (
        SELECT g.game_id, g.dt, g.source, g.game_type, g.home_team_id, g.away_team_id, g.home_score, g.away_score,
               ROW_NUMBER() OVER (PARTITION BY g.game_id ORDER BY g.dt) AS rn
        FROM {{table:fact_game}} g
        WHERE {{final:g.status}} AND g.home_score IS NOT NULL AND g.away_score IS NOT NULL
      ),
      games AS (
        SELECT game_id, dt, source, game_type, home_team_id, away_team_id, home_score, away_score
        FROM ranked
        WHERE rn = 1
      ),
      sides AS (
        SELECT game_id, dt, source, game_type, home_team_id AS team_id, away_team_id AS opponent_team_id,
               1 AS is_home, home_score AS runs_scored, away_score AS runs_allowed
        FROM games
        UNION ALL
        SELECT game_id, dt, source, game_type, away_team_id AS team_id, home_team_id AS opponent_team_id,
               0 AS is_home, away_score AS runs_scored, home_score AS runs_allowed
        FROM games
      )
      SELECT
        game_id, dt,
        CAST(dt AS DATE) AS game_date,
        YEAR(CAST(dt AS DATE)) AS season_year,
        {{league_of:source}} AS league_code,
        source AS data_source,
        game_type,
        {{season_phase:game_type:source}} AS season_phase,
        team_id, opponent_team_id, is_home, runs_scored, runs_allowed,
        CASE WHEN runs_scored > runs_allowed THEN 1 ELSE 0 END AS is_win,
        CASE WHEN runs_scored < runs_allowed THEN 1 ELSE 0 END AS is_loss,
        CASE WHEN runs_scored = runs_allowed THEN 1 ELSE 0 END AS is_tie
      FROM sides

  v_pitch:
    description: >
      fact_pitch with season, swing and whiff flags (vocabularies.pitch_result),
      and the batting and fielding team from the pitch's plate appearance.
    sql: |
      WITH pa AS (
        SELECT pa_id, batting_team_id, fielding_team_id
        FROM (
          SELECT f.pa_id, f.batting_team_id, f.fielding_team_id,
                 ROW_NUMBER() OVER (PARTITION BY f.pa_id ORDER BY f.dt DESC) AS rn
          FROM {{table:fact_plate_appearance}} f
        ) ranked
        WHERE rn = 1
      )
      SELECT
        p.pitch_id, p.game_id, p.pa_id, p.dt,
        CAST(p.dt AS DATE) AS game_date,
        YEAR(CAST(p.dt AS DATE)) AS season_year,
        {{league_of:p.source}} AS league_code,
        p.source AS data_source,
        p.pitcher_id, p.batter_id, pa.fielding_team_id AS pitching_team_id, pa.batting_team_id,
        p.pitch_number_in_pa, p.balls_before, p.strikes_before,
        NULLIF(p.pitch_type, '') AS pitch_type,
        p.release_speed, p.plate_x, p.plate_z, p.result,
        CASE WHEN p.result IN {{list:pitch_result.swing}} THEN 1 ELSE 0 END AS is_swing,
        CASE WHEN p.result IN {{list:pitch_result.whiff}} THEN 1 ELSE 0 END AS is_whiff
      FROM {{table:fact_pitch}} p
      LEFT JOIN pa ON pa.pa_id = p.pa_id

  v_run_expectancy_daily:
    description: run_expectancy_daily with a date column and a readable base-state label.
    sql: |
      SELECT
        r.league_code, r.season_year, r.base_state, r.outs, r.pa_count, r.runs, r.dt,
        CAST(r.dt AS DATE) AS game_date,
        {{label:base_state:r.base_state}} AS runners
      FROM {{table:run_expectancy_daily}} r

metric_views:
  # One Unity Catalog metric view each (CREATE VIEW ... WITH METRICS). Every
  # measure in `metrics` names the metric view it belongs to. Expressions use
  # source.<column> for the source view and <join name>.<column> for joins.
  mv_batting:
    description: Batting from plate appearances (MLB Statcast, NPB, Retrosheet), with RE24.
    source: v_plate_appearance
    joins:
      - name: batter
        source: v_player_current
        on: source.batter_id = batter.player_id
      - name: pitcher
        source: v_player_current
        on: source.pitcher_id = pitcher.player_id
      - name: batting_team
        source: v_team_current
        on: source.batting_team_id = batting_team.team_id
    dimensions:
      - {name: batter_id, expr: source.batter_id, role: player, description: Batter's player_id.}
      - {name: batter_name, expr: batter.primary_name, role: player, description: Batter's current name.}
      - {name: pitcher_id, expr: source.pitcher_id, description: Pitcher's player_id (null for NPB).}
      - {name: pitcher_name, expr: pitcher.primary_name, description: Pitcher's current name.}
      - {name: team_id, expr: source.batting_team_id, role: team, description: The batting team.}
      - {name: team_name, expr: batting_team.team_name, role: team, description: The batting team's current name.}
      - {name: league_code, expr: source.league_code, role: league, description: MLB or NPB.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year of the game.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date.}
      - {name: data_source, expr: source.data_source, description: "Source system: mlb_statcast, npb_spaia or retrosheet_local."}
      - {name: event_type, expr: source.event_type, description: "Outcome code, see vocabularies.event_type."}
      - {name: base_state_before, expr: source.base_state_before, type: int, description: Runners before the PA (bitmask).}
      - {name: outs_before, expr: source.outs_before, type: int, description: Outs before the PA.}
      - {name: inning, expr: source.inning, type: int, description: Inning.}

  mv_batting_box:
    description: Batting from box scores (MLB Stats API, KBO, local files). The only source of RBI and runs for MLB, and of any KBO batting.
    source: v_batting_line
    joins:
      - name: player
        source: v_player_current
        on: source.player_id = player.player_id
      - name: team
        source: v_team_current
        on: source.team_id = team.team_id
    dimensions:
      - {name: player_id, expr: source.player_id, role: player, description: Batter's player_id.}
      - {name: player_name, expr: player.primary_name, role: player, description: Batter's current name.}
      - {name: team_id, expr: source.team_id, role: team, description: The batter's team.}
      - {name: team_name, expr: team.team_name, role: team, description: The team's current name.}
      - {name: league_code, expr: source.league_code, role: league, description: League code.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year of the game.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date.}
      - {name: data_source, expr: source.data_source, description: Source system.}

  mv_pitching:
    description: Pitching from box scores (MLB Stats API, KBO, local files).
    source: v_pitching_line
    joins:
      - name: pitcher
        source: v_player_current
        on: source.player_id = pitcher.player_id
      - name: team
        source: v_team_current
        on: source.team_id = team.team_id
    dimensions:
      - {name: pitcher_id, expr: source.player_id, role: player, description: Pitcher's player_id.}
      - {name: pitcher_name, expr: pitcher.primary_name, role: player, description: Pitcher's current name.}
      - {name: team_id, expr: source.team_id, role: team, description: The pitcher's team.}
      - {name: team_name, expr: team.team_name, role: team, description: The team's current name.}
      - {name: league_code, expr: source.league_code, role: league, description: League code.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year of the game.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date.}
      - {name: data_source, expr: source.data_source, description: Source system.}

  mv_team_games:
    description: >
      Team results from finished games in fact_game (every league with game
      scores). Filter season_phase for the part of the season you want: the
      API and MCP default to regular season (season_phase regular or unknown)
      when a request doesn't filter season_phase; a Unity Catalog metric view
      can't hold a default, so filter it yourself there.
    source: v_team_game
    default_filters:
      - {dimension: season_phase, op: in, value: [regular, unknown]}
    not_applicable_roles:
      player: Game results belong to teams, not players.
    joins:
      - name: team
        source: v_team_current
        on: source.team_id = team.team_id
      - name: opponent
        source: v_team_current
        on: source.opponent_team_id = opponent.team_id
    dimensions:
      - {name: team_id, expr: source.team_id, role: team, description: The team.}
      - {name: team_name, expr: team.team_name, role: team, description: The team's current name.}
      - {name: team_abbrev, expr: team.team_abbrev, role: team, description: The team's abbreviation (MLB only).}
      - {name: opponent_team_id, expr: source.opponent_team_id, description: The opponent.}
      - {name: opponent_name, expr: opponent.team_name, description: The opponent's current name.}
      - {name: is_home, expr: source.is_home, type: int, description: "1 for home games, 0 for away."}
      - {name: season_phase, expr: source.season_phase, description: "regular, postseason, allstar, preseason, exhibition, other or unknown (vocabularies.season_phase). Filter to regular for a season record."}
      - {name: game_type, expr: source.game_type, description: The source's own game type code or name.}
      - {name: league_code, expr: source.league_code, role: league, description: League code.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year of the game.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date (first dt the game was final).}
      - {name: data_source, expr: source.data_source, description: Source system.}

  mv_pitches:
    description: Pitch tracking (MLB Statcast).
    source: v_pitch
    joins:
      - name: pitcher
        source: v_player_current
        on: source.pitcher_id = pitcher.player_id
      - name: batter
        source: v_player_current
        on: source.batter_id = batter.player_id
      - name: team
        source: v_team_current
        on: source.pitching_team_id = team.team_id
    dimensions:
      - {name: pitcher_id, expr: source.pitcher_id, role: player, description: Pitcher's player_id.}
      - {name: pitcher_name, expr: pitcher.primary_name, role: player, description: Pitcher's current name.}
      - {name: batter_id, expr: source.batter_id, description: Batter's player_id.}
      - {name: batter_name, expr: batter.primary_name, description: Batter's current name.}
      - {name: team_id, expr: source.pitching_team_id, role: team, description: The pitching (fielding) team.}
      - {name: team_name, expr: team.team_name, role: team, description: The pitching team's current name.}
      - {name: league_code, expr: source.league_code, role: league, description: Always MLB.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year of the game.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date.}
      - {name: pitch_type, expr: source.pitch_type, description: Statcast pitch type code.}
      - {name: pitch_type_name, expr: "{{label:pitch_type:source.pitch_type}}", description: Pitch type name (code when unlisted).}
      - {name: balls_before, expr: source.balls_before, type: int, description: Balls in the count.}
      - {name: strikes_before, expr: source.strikes_before, type: int, description: Strikes in the count.}

  mv_run_expectancy:
    description: Run expectancy matrix over any date range, summed from run_expectancy_daily.
    source: v_run_expectancy_daily
    not_applicable_roles:
      player: Run expectancy is a property of a league's base/out states, not of a player.
      team: Run expectancy is computed per league, not per team.
    dimensions:
      - {name: league_code, expr: source.league_code, role: league, description: MLB or NPB.}
      - {name: season_year, expr: source.season_year, role: season, type: int, description: Calendar year.}
      - {name: game_date, expr: source.game_date, role: date, type: date, description: Game date.}
      - {name: base_state, expr: source.base_state, type: int, description: Runners on base (bitmask).}
      - {name: runners, expr: source.runners, description: "Runners on base, as text."}
      - {name: outs, expr: source.outs, type: int, description: "Outs, 0-2."}

metrics:
  # name: {metric_view, description, expr, format, source_rationale, caveats}
  # format: count, rate (.000), percent (share 0-1), decimal (0.00), innings.

  # --- Batting, from plate appearances ---------------------------------------
  pa:
    metric_view: mv_batting
    description: Plate appearances.
    expr: SUM(source.is_pa)
    format: count
    source_rationale: &pa_why >
      fact_plate_appearance is the only batting source with every outcome
      (HBP, sacrifices, interference) and with NPB, and it is the same source
      as RE24. Box scores have no PA, HBP or SF and no NPB at all.
    caveats: [TRUNCATED rows are not plate appearances and are excluded.]
  ab:
    metric_view: mv_batting
    description: At-bats (1B, 2B, 3B, HR, K, OUT, DP, TP, FC, ERROR).
    expr: SUM(source.is_ab)
    format: count
    source_rationale: *pa_why
  hits:
    metric_view: mv_batting
    description: Hits.
    expr: SUM(source.is_hit)
    format: count
    source_rationale: *pa_why
  doubles:
    metric_view: mv_batting
    description: Doubles.
    expr: SUM(source.is_double)
    format: count
    source_rationale: *pa_why
  triples:
    metric_view: mv_batting
    description: Triples.
    expr: SUM(source.is_triple)
    format: count
    source_rationale: *pa_why
  home_runs:
    metric_view: mv_batting
    description: Home runs.
    expr: SUM(source.is_hr)
    format: count
    source_rationale: *pa_why
  walks:
    metric_view: mv_batting
    description: Walks, intentional included.
    expr: SUM(source.is_bb)
    format: count
    source_rationale: *pa_why
  hit_by_pitch:
    metric_view: mv_batting
    description: Times hit by a pitch.
    expr: SUM(source.is_hbp)
    format: count
    source_rationale: *pa_why
  strikeouts:
    metric_view: mv_batting
    description: Strikeouts.
    expr: SUM(source.is_k)
    format: count
    source_rationale: *pa_why
  sac_flies:
    metric_view: mv_batting
    description: Sacrifice flies (SF; legacy SAC rows count here until the gold rebuild).
    expr: SUM(source.is_sf)
    format: count
    source_rationale: *pa_why
    caveats: [Until the gold rebuild this includes sacrifice bunts written as SAC.]
  sac_bunts:
    metric_view: mv_batting
    description: Sacrifice bunts (SH).
    expr: SUM(source.is_sh)
    format: count
    source_rationale: *pa_why
    caveats: [Until the gold rebuild, sacrifice bunts written before the SF/SH split are SAC and count as sac_flies instead.]
  total_bases:
    metric_view: mv_batting
    description: Total bases (1B = 1, 2B = 2, 3B = 3, HR = 4).
    expr: SUM(source.total_bases)
    format: count
    source_rationale: *pa_why
  avg:
    metric_view: mv_batting
    description: Batting average, hits / at-bats.
    expr: SUM(source.is_hit) / NULLIF(SUM(source.is_ab), 0)
    format: rate
    source_rationale: *pa_why
    caveats: &sf_dp_ab
      - Until the gold rebuild, a sacrifice fly double play written before the SF/SH split is DP and so counts as an at-bat, though officially it isn't one.
  obp:
    metric_view: mv_batting
    description: On-base percentage, (H + BB + HBP) / (AB + BB + HBP + SF). Sacrifice bunts are left out, as officially.
    expr: >-
      (SUM(source.is_hit) + SUM(source.is_bb) + SUM(source.is_hbp))
      / NULLIF(SUM(source.is_ab) + SUM(source.is_bb) + SUM(source.is_hbp) + SUM(source.is_sf), 0)
    format: rate
    source_rationale: *pa_why
    caveats:
      - Rows written before the SF/SH split (until the gold rebuild) carry SAC for both kinds; they count as sacrifice flies, so OBP on those rows is slightly low for batters with sacrifice bunts.
  slg:
    metric_view: mv_batting
    description: Slugging percentage, total bases / at-bats.
    expr: SUM(source.total_bases) / NULLIF(SUM(source.is_ab), 0)
    format: rate
    source_rationale: *pa_why
    caveats: *sf_dp_ab
  ops:
    metric_view: mv_batting
    description: On-base plus slugging, OBP + SLG.
    expr: >-
      (SUM(source.is_hit) + SUM(source.is_bb) + SUM(source.is_hbp))
      / NULLIF(SUM(source.is_ab) + SUM(source.is_bb) + SUM(source.is_hbp) + SUM(source.is_sf), 0)
      + SUM(source.total_bases) / NULLIF(SUM(source.is_ab), 0)
    format: rate
    source_rationale: *pa_why
    caveats: [Inherits the OBP sacrifice caveat.]
  bb_pct:
    metric_view: mv_batting
    description: Walk rate, walks / plate appearances (a share, 0-1).
    expr: SUM(source.is_bb) / NULLIF(SUM(source.is_pa), 0)
    format: percent
    source_rationale: *pa_why
  k_pct:
    metric_view: mv_batting
    description: Strikeout rate, strikeouts / plate appearances (a share, 0-1).
    expr: SUM(source.is_k) / NULLIF(SUM(source.is_pa), 0)
    format: percent
    source_rationale: *pa_why
  runs_on_play:
    metric_view: mv_batting
    description: Runs the batting team scored during these plate appearances, TRUNCATED rows included.
    expr: SUM(source.runs_scored_on_play)
    format: count
    source_rationale: *pa_why
    caveats: [Not the batter's runs or RBI. For MLB team totals per game it equals the final score when the feed is complete.]
  re24:
    metric_view: mv_batting
    description: >
      RE24 run value: the sum over plate appearances of (run expectancy after -
      run expectancy before + runs scored), with the league's full-season
      matrix (summed from run_expectancy_daily). Positive means the batter added runs.
    expr: SUM(source.run_value)
    format: decimal
    source_rationale: *pa_why
    caveats:
      - TRUNCATED rows count (they carry the inning's last runs and outs), as do base-running events Statcast credits to the PA.
      - PAs whose state after is unknown (a walk-off, NPB text without the runners) have no run value and are left out.
      - The run expectancy matrix is the league's whole season summed from run_expectancy_daily, so it covers only the dates loaded so far while the season is in progress, and a PA is valued against games played after it as well as before.

  # --- Batting, from box scores ------------------------------------------------
  rbi:
    metric_view: mv_batting_box
    description: Runs batted in.
    expr: SUM(source.rbi)
    format: count
    source_rationale: &box_why >
      Box scores are the only source with RBI and runs scored for MLB, and the
      only batting source for KBO.
  batter_runs:
    metric_view: mv_batting_box
    description: Runs scored by the batter.
    expr: SUM(source.r)
    format: count
    source_rationale: *box_why
  box_games:
    metric_view: mv_batting_box
    description: Games with a box-score batting line.
    expr: COUNT(DISTINCT source.game_id)
    format: count
    source_rationale: *box_why
  box_avg:
    metric_view: mv_batting_box
    description: Batting average from box scores, hits / at-bats. Use avg where plate appearances exist; this is for KBO and box-score-only data.
    expr: SUM(source.h) / NULLIF(SUM(source.ab), 0)
    format: rate
    source_rationale: *box_why

  # --- Pitching, from box scores -----------------------------------------------
  outs_recorded:
    metric_view: mv_pitching
    description: Outs recorded (innings pitched x 3).
    expr: SUM(source.ip_outs)
    format: count
    source_rationale: &pitch_why >
      Box scores are the only source of earned runs, and they cover MLB and
      KBO. Plate appearances have no pitcher for NPB and no earned/unearned split.
  ip:
    metric_view: mv_pitching
    description: Innings pitched as a number, outs / 3 (6.1 innings = 6.333).
    expr: SUM(source.ip_outs) / 3.0
    format: decimal
    source_rationale: *pitch_why
    caveats: [Summed as outs, never as the "6.1" strings.]
  ip_display:
    metric_view: mv_pitching
    description: Innings pitched in baseball notation, whole innings and thirds ("6.1" = 6 1/3).
    expr: concat(CAST(CAST(FLOOR(SUM(source.ip_outs) / 3) AS BIGINT) AS STRING), '.', CAST(CAST(SUM(source.ip_outs) % 3 AS BIGINT) AS STRING))
    format: innings
    source_rationale: *pitch_why
  games_pitched:
    metric_view: mv_pitching
    description: Games with a pitching line.
    expr: COUNT(DISTINCT source.game_id)
    format: count
    source_rationale: *pitch_why
  hits_allowed:
    metric_view: mv_pitching
    description: Hits allowed.
    expr: SUM(source.h)
    format: count
    source_rationale: *pitch_why
  earned_runs:
    metric_view: mv_pitching
    description: Earned runs allowed.
    expr: SUM(source.er)
    format: count
    source_rationale: *pitch_why
  pitcher_strikeouts:
    metric_view: mv_pitching
    description: Strikeouts by the pitcher.
    expr: SUM(source.so)
    format: count
    source_rationale: *pitch_why
  pitcher_walks:
    metric_view: mv_pitching
    description: Walks allowed.
    expr: SUM(source.bb)
    format: count
    source_rationale: *pitch_why
    caveats: [kbo_api counts walks plus hit batters.]
  era:
    metric_view: mv_pitching
    description: Earned run average, 9 x earned runs / innings pitched.
    expr: 27.0 * SUM(source.er) / NULLIF(SUM(source.ip_outs), 0)
    format: decimal
    source_rationale: *pitch_why
    caveats: [Lines whose ip doesn't parse have no outs, so their earned runs still count against zero innings. None do in the current data.]
  whip:
    metric_view: mv_pitching
    description: Walks plus hits per inning pitched.
    expr: 3.0 * (SUM(source.bb) + SUM(source.h)) / NULLIF(SUM(source.ip_outs), 0)
    format: decimal
    source_rationale: *pitch_why
  k_per_9:
    metric_view: mv_pitching
    description: Strikeouts per nine innings.
    expr: 27.0 * SUM(source.so) / NULLIF(SUM(source.ip_outs), 0)
    format: decimal
    source_rationale: *pitch_why
  bb_per_9:
    metric_view: mv_pitching
    description: Walks per nine innings.
    expr: 27.0 * SUM(source.bb) / NULLIF(SUM(source.ip_outs), 0)
    format: decimal
    source_rationale: *pitch_why

  # --- Teams, from games ----------------------------------------------------------
  games_played:
    metric_view: mv_team_games
    description: Finished games.
    expr: COUNT(*)
    format: count
    source_rationale: &team_why >
      fact_game has final scores for every league with games (MLB, NPB, KBO);
      fact_standings covers NPB only, and box scores miss NPB.
    caveats: &team_caveats
      - Regular season (and games whose type is unknown) by default in the API and MCP; filter season_phase in Unity Catalog. Games published before gold had game_type are unknown, postseason included.
  wins:
    metric_view: mv_team_games
    description: Wins.
    expr: SUM(source.is_win)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats
  losses:
    metric_view: mv_team_games
    description: Losses.
    expr: SUM(source.is_loss)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats
  ties:
    metric_view: mv_team_games
    description: Ties (NPB plays them).
    expr: SUM(source.is_tie)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats
  win_pct:
    metric_view: mv_team_games
    description: Winning percentage, wins / (wins + losses); ties don't count, as in NPB standings.
    expr: SUM(source.is_win) / NULLIF(SUM(source.is_win) + SUM(source.is_loss), 0)
    format: rate
    source_rationale: *team_why
    caveats: *team_caveats
  runs_scored:
    metric_view: mv_team_games
    description: Runs scored.
    expr: SUM(source.runs_scored)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats
  runs_allowed:
    metric_view: mv_team_games
    description: Runs allowed.
    expr: SUM(source.runs_allowed)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats
  run_differential:
    metric_view: mv_team_games
    description: Runs scored minus runs allowed.
    expr: SUM(source.runs_scored) - SUM(source.runs_allowed)
    format: count
    source_rationale: *team_why
    caveats: *team_caveats

  # --- Pitches, from Statcast ------------------------------------------------------
  pitches:
    metric_view: mv_pitches
    description: Pitches thrown.
    expr: COUNT(*)
    format: count
    source_rationale: &pitchtrack_why fact_pitch is the only pitch-level source (Statcast, MLB only).
  avg_velocity:
    metric_view: mv_pitches
    description: Average release speed, mph.
    expr: AVG(source.release_speed)
    format: decimal
    source_rationale: *pitchtrack_why
    caveats: [Compare within a pitch_type; a mix of pitch types averages fastballs with breaking balls.]
  max_velocity:
    metric_view: mv_pitches
    description: Fastest release speed, mph.
    expr: MAX(source.release_speed)
    format: decimal
    source_rationale: *pitchtrack_why
  swings:
    metric_view: mv_pitches
    description: Pitches swung at (vocabularies.pitch_result.swing).
    expr: SUM(source.is_swing)
    format: count
    source_rationale: *pitchtrack_why
  whiffs:
    metric_view: mv_pitches
    description: Swings and misses (vocabularies.pitch_result.whiff).
    expr: SUM(source.is_whiff)
    format: count
    source_rationale: *pitchtrack_why
  whiff_rate:
    metric_view: mv_pitches
    description: Whiffs / swings (a share, 0-1).
    expr: SUM(source.is_whiff) / NULLIF(SUM(source.is_swing), 0)
    format: percent
    source_rationale: *pitchtrack_why
    caveats: [Foul tips are swings with contact, not whiffs.]

  # --- Run expectancy matrix ------------------------------------------------------
  exp_runs:
    metric_view: mv_run_expectancy
    description: Expected runs to the end of the half-inning from a base/out state, over the chosen dates.
    expr: SUM(source.runs) / NULLIF(SUM(source.pa_count), 0)
    format: decimal
    source_rationale: >
      run_expectancy_daily sums correctly over any date range; run_expectancy
      is already season-to-date per dt, so summing it would double count.
    caveats: [Group by league_code, base_state and outs; mixing states or leagues gives a meaningless average.]
  re_pa_count:
    metric_view: mv_run_expectancy
    description: Plate appearances behind the run expectancy (the sample size).
    expr: SUM(source.pa_count)
    format: count
    source_rationale: Same as exp_runs.
