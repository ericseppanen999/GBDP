# Japanese phrases in SPAIA's NPB play-by-play, and what they mean.
# Used by gold/publish.py to turn play-by-play text into plate appearances.
#
# Checked against every May-June 2026 game (156): with these rules, hits per
# team equal the feed's own totals in all 156. When adding a phrase, re-run
# that reconciliation (see tests/test_npb_plate_appearances.py).

# PA header prefix ("＜1番：名原＞一死一三塁") -> outs before the PA.
outs:
  無死: 0   # no outs
  一死: 1   # one out
  二死: 2   # two outs

# Runner marks in a header or result ("一三塁" = first and third).
runners:
  loaded: 満塁     # bases loaded
  first: 一
  second: 二
  third: 三

# The roster endpoint is the whole team directory, staff included.
# StaffKind -> role. Checked on 2026-06-10: kind 3 carries coach titles
# (投手コーチ, 二軍打撃コーチ, ...), kind 5 player-coaches (選手兼任), and kinds
# 1 and 2 one person per first-team club. Only players go to identity and gold.
staff_kinds:
  "1": manager
  "2": manager
  "3": coach
  "4": player
  "5": player      # player-coach
  "7": staff
  "10": staff

# RosterName -> position group. SPAIA gives no bats/throws on rosters.
positions:
  投手: P     # pitcher
  捕手: C     # catcher
  内野手: IF  # infielder
  外野手: OF  # outfielder

# Result text -> event type. Checked IN ORDER and the first match wins, so
# compound results ("bunt attempt, but grounded out") must come before the
# words they contain. A phrase matches as a substring; "*" in a phrase matches
# any text between its parts, in order.
events:
  # A sacrifice fly that also doubles a runner off is still a sacrifice fly
  # (not an at-bat), as Statcast's sac_fly_double_play is, so it comes first.
  - event: SF
    phrases: [犠飛, 犠牲フライ]                         # sacrifice fly (in OBP's denominator)
  - event: TP
    phrases: [三重殺, トリプルプレー]                  # triple play
  - event: DP
    phrases: [併殺, ダブルプレー]                      # double play
  - event: HR
    phrases: [本塁打, ホームラン]                      # home run
  - event: 3B
    phrases: [三塁打, スリーベース]                    # triple
  - event: 2B
    phrases: [二塁打, ツーベース]                      # double
  # A two-strike bunt (スリーバント) that fails, foul or missed, is a strikeout
  # (CR-021), so it comes before the failed-bunt outs.
  - event: K
    phrases: [スリーバント*失敗, スリーバントを試みるも*ファウル, スリーバントを試みるも*空振り]
  # A squeeze on which the runner is thrown out at home is a fielder's choice
  # and an at-bat, not a sacrifice (CR-022).
  - event: FC
    phrases: [スクイズ*本塁*アウト, スクイズ*本塁*封殺, スクイズ*ホーム*アウト]
  # A failed bunt is an out, so these come before SH.
  - event: OUT
    phrases: [送りバント失敗, スクイズ失敗, バント失敗, 送りバントを試みるも, スクイズを試みるも]
  # A sacrifice stays a sacrifice (not an at-bat) when the batter also reaches
  # on an error or fielder's choice (rule 9.08, as Retrosheet scores it), so SH
  # comes before ERROR and FC: 送りバント成功！打者走者…のエラーにより出塁する.
  # Only wording that says the bunt succeeded, so a hit or an out after a
  # bunt stance (送りバントの構えから…) still falls through to its own rule.
  - event: SH
    phrases: [犠打, 送りバント成功, 送りバントを成功, 送りバントを決め, スクイズ成功, スクイズを成功, スクイズを決め,
              送りバント*悪送球, 送りバント*エラー, 送りバント*失策, 送りバント*野選, 送りバント*フィルダースチョイス,
              スクイズ*悪送球, スクイズ*エラー, スクイズ*失策, スクイズ*野選, スクイズ*フィルダースチョイス]
  - event: ERROR
    # Reached on error is written as the misplay: error, fumble, ball let
    # through, bad throw, dropped ball.
    phrases: [失策, エラー, ファンブル, 後逸, 悪送球, 落球]
  - event: FC
    phrases: [野選, フィルダースチョイス]              # fielder's choice
  - event: INT
    phrases: [打撃妨害]                                # catcher's interference
  - event: OUT
    # "試みるも" = "tried, but": a bunt attempt that became an out.
    phrases: [試みるも]
  - event: 1B
    # A safety or push bunt that reaches is scored a hit.
    phrases: [安打, ヒット, セーフティバント, プッシュバント]
  - event: BB
    phrases: [四球, フォアボール, 敬遠]                # walk, intentional walk
  - event: HBP
    phrases: [死球, デッドボール]                      # hit by pitch
  - event: K
    phrases: [三振, 振り逃げ]                          # strikeout, dropped third strike
  # A failed bunt attempt, or a swing from a bunt stance (バスター), that isn't
  # a hit is an at-bat, so these come before the late SH rule (CR-022).
  - event: OUT
    phrases: [失敗, バスター, 構えから]
  - event: SH
    phrases: [送りバント, スクイズ]                     # any other sacrifice bunt or squeeze
  - event: OUT
    phrases: [アウト, ゴロ, フライ, ライナー, ファウルフライ]  # out, grounder, fly, liner
