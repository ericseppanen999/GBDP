bundle:
  name: gbdp

# Authentication: set DATABRICKS_HOST and DATABRICKS_TOKEN environment variables
# (or configure a profile in ~/.databrickscfg).
# GitHub Actions reads these from repository secrets.

variables:
  uc_catalog:
    description: Unity Catalog catalog name (must be pre-created by a workspace admin)
    default: gbdp

  bronze_schema:
    description: UC schema for bronze tables
    default: bronze_gbdp

  silver_schema:
    description: UC schema for silver tables
    default: silver_gbdp

  gold_schema:
    description: UC schema for gold tables
    default: gold_gbdp

  # Every deploy applies this to the nightly schedule, overriding a pause made
  # in the UI or API. Change it here (and push) to turn the nightly on or off.
  nightly_pause_status:
    description: PAUSED or UNPAUSED for the gbdp-nightly schedule
    default: PAUSED

  warehouse_id:
    description: SQL warehouse that runs the dashboard's queries
    default: a9d3d2589a30ab67

# Files synced to the workspace on every deploy (data/ excluded — too large).
sync:
  exclude:
    - .git
    - .github
    - data/**
    - "**/__pycache__"
    - "**/*.pyc"
    - "**/*.egg-info/**"
    - .env
    - .env.*

resources:
  # AI/BI dashboard over the gold UC tables. Generated from
  # scripts/build_dashboard.py; regenerate rather than editing the JSON.
  dashboards:
    gbdp_season:
      display_name: GBDP 2026 season
      file_path: ./dashboards/gbdp_season.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Viewers it's shared with read through the owner's access, so they need
      # no grants on gbdp.gold_gbdp.
      embed_credentials: true

  # -------------------------------------------------------------------------
  # Jobs — Free Edition runs on serverless compute only (no job clusters).
  # Python dependencies are declared in the environment spec below.
  # -------------------------------------------------------------------------
  jobs:

    # -- Nightly pipeline ---------------------------------------------------
    gbdp_nightly:
      name: gbdp-nightly
      description: Nightly ingestion pipeline covering the last 7 days
      max_concurrent_runs: 1
      timeout_seconds: 0
      queue:
        enabled: true

      email_notifications:
        on_success:
          - eric.t.seppanen@gmail.com
        on_failure:
          - eric.t.seppanen@gmail.com

      # Runs at 04:00 UTC daily.
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: UTC
        pause_status: ${var.nightly_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - pyarrow
              - python-dateutil
              - pydantic
              - pyyaml
              - duckdb

      tasks:
        - task_key: gbdp_run
          description: Full pipeline — ingest → silver → identity → gold → quality
          environment_key: default
          # No serverless auto-retry (see gbdp_backfill): a failure emails, and
          # the next night's 7-day correction window re-runs those dates anyway.
          max_retries: 0
          retry_on_timeout: false
          disable_auto_optimization: true
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - run
              - --start
              - "1970-01-01"   # placeholder; --window nightly overrides this
              - --end
              - "1970-01-01"   # placeholder; --window nightly overrides this
              - --window
              - nightly
              - --force        # the correction window has to replace earlier fetches
              - --sources
              - ${workspace.file_path}/configs/sources.yaml
              - --storage-format
              - delta
              - --bronze-root
              - /Volumes/${var.uc_catalog}/${var.bronze_schema}/bronze_vol/gbdp/bronze
              - --silver-root
              - /Volumes/${var.uc_catalog}/${var.silver_schema}/silver_vol/gbdp/silver
              - --gold-root
              - /Volumes/${var.uc_catalog}/${var.gold_schema}/gold_vol/gbdp/gold
              - --manual-root
              - /Volumes/${var.uc_catalog}/${var.bronze_schema}/bronze_vol/gbdp/manual
              - --retries
              - "2"
              - --retry-delay
              - "5"
              - --uc-catalog
              - ${var.uc_catalog}
              - --uc-bronze-schema
              - ${var.bronze_schema}
              - --uc-silver-schema
              - ${var.silver_schema}
              - --uc-gold-schema
              - ${var.gold_schema}
              - --uc-mode
              - managed
              - --http-timeout
              - "120"
              - --http-retries
              - "5"

    # -- Semantic layer -------------------------------------------------------
    # Table/column comments, v_* views and mv_* metric views from
    # configs/semantic_layer.yaml. Run by hand after a gold rebuild or a YAML
    # change; it exits 1 if any statement fails. Not in the nightly yet: two
    # views need columns the production rebuild adds, and a nightly that
    # fails every night would hide real failures. Check it first with
    #   python scripts/build_semantic_layer.py --validate-in semantic_check
    gbdp_semantic_layer:
      name: gbdp-semantic-layer
      description: Apply configs/semantic_layer.yaml to Unity Catalog (comments, views, metric views)
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - eric.t.seppanen@gmail.com
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - pyarrow
              - python-dateutil
              - pydantic
              - pyyaml
              - duckdb
      tasks:
        - task_key: gbdp_semantic_layer
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - semantic-layer
              - --catalog
              - ${var.uc_catalog}
              - --schema
              - ${var.gold_schema}
              - --uc-mode
              - managed

    # -- Purge stale nested delta logs --------------------------------------
    gbdp_purge_stale:
      name: gbdp-purge-stale
      description: Delete gold tables with stale nested delta logs
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - eric.t.seppanen@gmail.com
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pyarrow
              - pyyaml
      tasks:
        - task_key: gbdp_purge_stale
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - purge-stale
              - --gold-root
              - /Volumes/${var.uc_catalog}/${var.gold_schema}/gold_vol/gbdp/gold

    # -- Data check ---------------------------------------------------------
    gbdp_check_data:
      name: gbdp-check-data
      description: Report gold table row counts for a given date
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - eric.t.seppanen@gmail.com
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - pyarrow
              - python-dateutil
              - pydantic
              - pyyaml
              - duckdb
      tasks:
        - task_key: gbdp_check_data
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - check-data
              - --storage-format
              - delta
              - --gold-root
              - /Volumes/${var.uc_catalog}/${var.gold_schema}/gold_vol/gbdp/gold

    # -- Delta write smoke test ---------------------------------------------
    gbdp_test_write:
      name: gbdp-test-write
      description: Smoke-test Delta write path against a throwaway table
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - eric.t.seppanen@gmail.com
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - pyarrow
              - python-dateutil
              - pydantic
              - pyyaml
              - duckdb
      tasks:
        - task_key: gbdp_test_write
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - test-write
              - --storage-format
              - delta
              - --gold-root
              - /Volumes/${var.uc_catalog}/${var.gold_schema}/gold_vol/gbdp/gold

    # -- Manual backfill ----------------------------------------------------
    gbdp_backfill:
      name: gbdp-backfill
      description: Historical backfill — trigger manually with start_date / end_date
      max_concurrent_runs: 1
      timeout_seconds: 0
      queue:
        enabled: true

      email_notifications:
        on_failure:
          - eric.t.seppanen@gmail.com

      parameters:
        - name: start_date
          default: "1960-04-12"
        - name: end_date
          default: "1960-04-19"
        - name: leagues
          default: all
        - name: stages
          default: ""
        # Rebuild SCD2 dims from scratch from this date (e.g. a backfill's start).
        - name: fresh_dims_before
          default: ""

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - pyarrow
              - python-dateutil
              - pydantic
              - pyyaml
              - duckdb

      tasks:
        - task_key: gbdp_backfill
          description: Historical data ingestion for a custom date range
          environment_key: default
          # Serverless retries a failed task by default, which re-ran a whole
          # 10-hour range from identity_resolve after a quality failure on four
          # dates (2026-11-10). The pipeline retries each stage window itself.
          max_retries: 0
          retry_on_timeout: false
          # max_retries: 0 alone didn't stop it (a zero is dropped on deploy, and
          # serverless auto-optimization retries failed tasks by default): it
          # retried again on 2026-11-10, re-publishing all of gold's UC tables.
          disable_auto_optimization: true
          spark_python_task:
            python_file: ${workspace.file_path}/dbx_entry.py
            parameters:
              - backfill
              - --start
              - "{{job.parameters.start_date}}"
              - --end
              - "{{job.parameters.end_date}}"
              - --leagues
              - "{{job.parameters.leagues}}"
              - --stages
              - "{{job.parameters.stages}}"
              - --fresh-dims-before
              - "{{job.parameters.fresh_dims_before}}"
              - --sources
              - ${workspace.file_path}/configs/sources.yaml
              - --force
              - --storage-format
              - delta
              - --bronze-root
              - /Volumes/${var.uc_catalog}/${var.bronze_schema}/bronze_vol/gbdp/bronze
              - --silver-root
              - /Volumes/${var.uc_catalog}/${var.silver_schema}/silver_vol/gbdp/silver
              - --gold-root
              - /Volumes/${var.uc_catalog}/${var.gold_schema}/gold_vol/gbdp/gold
              - --manual-root
              - /Volumes/${var.uc_catalog}/${var.bronze_schema}/bronze_vol/gbdp/manual
              - --retries
              - "2"
              - --retry-delay
              - "5"
              - --chunk
              - month
              - --uc-catalog
              - ${var.uc_catalog}
              - --uc-bronze-schema
              - ${var.bronze_schema}
              - --uc-silver-schema
              - ${var.silver_schema}
              - --uc-gold-schema
              - ${var.gold_schema}
              - --uc-mode
              - managed
              - --http-timeout
              - "180"
              - --http-retries
              - "1"

# ---------------------------------------------------------------------------
# Deployment targets
# ---------------------------------------------------------------------------
targets:
  # Local iteration: `databricks bundle deploy` (default)
  dev:
    mode: development
    default: true

  # Production: `databricks bundle deploy --target prod`
  # Used by GitHub Actions on every push to main.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/eric.t.seppanen@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Resumed 2026-11-11 after the full-season gold rebuild reconciled.
      nightly_pause_status: UNPAUSED
